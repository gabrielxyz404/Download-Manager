<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Flow Downloads</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1b1b; --muted: #666; --field: #f3f3f3; --border: #d0d0d0;
    --accent: #2b5c99; --accent-fg: #fff; --ok: #2e7d32; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1f22; --fg: #e6e6e6; --muted: #a0a0a0; --field: #2b2d31; --border: #3f4147;
            --accent: #3f78bf; --ok: #5fd27a; --err: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--fg);
         font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px;
           border-bottom: 1px solid var(--border); }
  header img { width: 22px; height: 22px; }
  header b { font-size: 14px; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  #appState { color: var(--muted); font-size: 12px; }
  section { padding: 12px 14px; }
  h2 { margin: 0 0 8px; font-size: 13px; }
  input[type=url] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
                    background: var(--field); color: var(--fg); font: inherit; }
  input[type=url]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 6px; cursor: pointer;
           background: var(--accent); color: var(--accent-fg); font: 600 13px system-ui, sans-serif; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 18px; margin-top: 6px; font-size: 12px; }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border);
                     font-weight: 500; margin-top: 0; }
  #openBox { padding: 0 14px 12px; }
  #last { padding: 0 14px 10px; font-size: 11px; color: var(--muted); word-break: break-word; }
  .row.small { border-top: 1px solid var(--border); padding: 8px 14px; }
  .row.small button { margin: 0; }
  .hint { padding: 0 14px 10px; font-size: 11px; color: var(--muted); }
  label.row { display: flex; align-items: center; gap: 8px; cursor: pointer;
              border-top: 1px solid var(--border); padding: 10px 14px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <b>Flow Downloads</b>
    <span class="dot" id="dot"></span>
    <span id="appState">verificando...</span>
  </header>

  <section>
    <h2>Baixar vídeo</h2>
    <form id="videoForm">
      <input type="url" id="url" placeholder="Cole aqui o link do vídeo (Ctrl+V)" required autofocus>
      <button type="submit" id="go">⬇ Baixar vídeo</button>
    </form>
    <div id="msg"></div>
  </section>

  <div id="last"></div>
  <div id="openBox"><button class="secondary" id="open">Abrir Flow Downloads</button></div>

  <label class="row">
    <input type="checkbox" id="capture">
    Capturar downloads do navegador
  </label>
  <label class="row" id="siteRow" hidden>
    <input type="checkbox" id="site">
    <span>Capturar neste site: <b id="siteName"></b></span>
  </label>
  <div class="row small">
    <button class="secondary" id="next">Próximo download fica no navegador</button>
  </div>
  <div class="hint">Dica: segure <b>Alt</b> ao clicar num link para o navegador baixar sozinho.</div>

  <script src="popup.js"></script>
</body>
</html>
